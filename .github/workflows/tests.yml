name: Tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-console/package-lock.json
      - run: npm ci
      - run: npm run build && npm run test:sites
      - run: npx playwright install --with-deps chromium
      - run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          npx playwright test tests/visual-qa.spec.js tests/regressions.spec.js tests/m2.spec.js tests/m3.spec.js
