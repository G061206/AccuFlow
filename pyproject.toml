[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "accuflow"
version = "0.1.0"
description = "IBKR-only US equity accumulation monitoring service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "psutil>=7,<8",
  "exchange-calendars>=4.11,<5",
  "tzdata>=2025.2",
  "fastapi>=0.116,<1",
  "ib_async>=2.1,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
accuflow = "accuflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/accuflow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

